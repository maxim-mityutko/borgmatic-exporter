name: Build Image

on:
  push:
    branches: ['master', 'main']
    tags: ['v*.*.*', 'latest']
  pull_request:
    branches: ['master', 'main']
    paths-ignore: ['README.md']
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      borgmatic-image-version:
        description: 'Borgmatic base image version to build and test'
        required: true
        default: 'latest'
      publish-image:
        description: 'Publish the tested image as dev after all checks pass'
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BORGMATIC_IMAGE_VERSION: ${{ github.event.inputs.borgmatic-image-version || 'latest' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.0'
      - name: Check Coverage
        run: |
          pip install poetry
          poetry install --no-root --with dev
          poetry run pytest --cov

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Super-Linter
        uses: super-linter/super-linter@v5.7.2
        env:
          DEFAULT_BRANCH: master
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_PYLINT: true

  resolve-base:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.base.outputs.image }}
      repository: ${{ steps.base.outputs.repository }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable Borgmatic base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          base="ghcr.io/borgmatic-collective/borgmatic"
          digest=$(docker buildx imagetools inspect "$base:$BORGMATIC_IMAGE_VERSION" |
            awk '$1 == "Digest:" && !seen++ { print $2 }')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$base@$digest" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Borgmatic base: $base:$BORGMATIC_IMAGE_VERSION ($digest)" >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration (${{ matrix.arch }})
    needs: resolve-base
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.0'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Install host test tools
        run: |
          pip install poetry
          poetry install --no-root --with dev
      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          platforms: linux/${{ matrix.arch }}
          tags: borgmatic-exporter:integration-${{ matrix.arch }}
          build-args: |
            BORGMATIC_IMAGE_VERSION=${{ env.BORGMATIC_IMAGE_VERSION }}
            BORGMATIC_IMAGE=${{ needs.resolve-base.outputs.image }}
          cache-from: type=gha,scope=integration-${{ matrix.arch }}
          cache-to: type=gha,scope=integration-${{ matrix.arch }},mode=max
      - name: Test Borgmatic and exporter together
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: |
          mkdir -p .integration-artifacts
          docker image inspect borgmatic-exporter:integration-${{ matrix.arch }} \
            > .integration-artifacts/image.json
          poetry run pytest -m integration --integration-backend=docker \
            --integration-image=borgmatic-exporter:integration-${{ matrix.arch }} \
            --junitxml=.integration-artifacts/results.xml tests/integration
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results-${{ matrix.arch }}
          path: .integration-artifacts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Save tested image for publication
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish-image)
        run: |
          docker save borgmatic-exporter:integration-${{ matrix.arch }} \
            --output "${{ runner.temp }}/tested-${{ matrix.arch }}.tar"
      - name: Upload tested image
        if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish-image)
        uses: actions/upload-artifact@v4
        with:
          name: tested-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/tested-${{ matrix.arch }}.tar
          retention-days: 1
          compression-level: 0

  publish:
    needs: [test, lint, resolve-base, integration]
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.publish-image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ needs.resolve-base.outputs.repository }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Download tested images
        uses: actions/download-artifact@v4
        with:
          pattern: tested-image-*
          path: tested-images
          merge-multiple: true
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Publish the tested images without rebuilding
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          sources=()
          for arch in amd64 arm64; do
            docker load --input "tested-images/tested-$arch.tar"
            staging="$IMAGE_NAME:tested-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
            docker tag "borgmatic-exporter:integration-$arch" "$staging"
            docker push "$staging"
            sources+=("$staging")
          done
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "${sources[@]}"
          done <<< "$IMAGE_TAGS"
