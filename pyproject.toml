[tool.poetry]
name = "borgmatic-exporter"
version = "0.4.1"
description = ""
authors = [
    "Maxim Mityutko <m@brhd.io>",
    "Dani Hodovic <dani.hodovic@gmail.com>"
]
packages = [{include = "src"}]

[tool.poetry.scripts]
borgmatic-exporter = 'src.cli:cli'

[tool.poetry.dependencies]
python = "<3.15.0,>=3.14.5"
prometheus-client = "^0.25.0"
click = "^8.4.0"
pretty-errors = "^1.2.25"
loguru = "^0.7.3"
Flask = "^3.1.3"
Flask-Caching = "^2.4.0"
Jinja2 = "^3.1.6"
waitress = "^3.0.2"
werkzeug = "^3.1.8"
arrow = "^1.4.0"
timy = "^0.4.2"
urllib3 = "^2.7.0"

[tool.poetry.group.dev.dependencies]
pylint = "^4.0.5"
pytest = "^9.0.3"
black = "^26.5.1"
isort = "^8.0.1"
jedi = "^0.20.0"
pytest-cov = "^7.1.0"
requests = "^2.34.2"
pytest-mock = "^3.15.1"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10.0"

[build-system]
requires = ["poetry-core>=2.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = [
    "src"
]
omit = [
    ".venv/*",
    ".virtualenv/*",
    "tests/"
]

[tool.coverage.report]
fail_under = 70

[tool.coverage.html]
directory = ".html"

[tool.black]
skip_numeric_underscore_normalization = true
exclude = ".*(venv|virtualenv|migrations|node_modules|s3)"

[tool.isort]
profile = "black"
multi_line_output = 3
skip = '.virtualenv,.venv'
