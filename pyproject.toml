[tool.poetry]
name = "borgmatic-exporter"
version = "0.6.2"
description = ""
authors = [
    "Maxim Mityutko <m@brhd.io>",
    "Dani Hodovic <dani.hodovic@gmail.com>"
]
packages = [{include = "src"}]

[tool.poetry.scripts]
borgmatic-exporter = 'src.cli:cli'

[tool.poetry.dependencies]
python = "<3.16.0,>=3.15.0"
prometheus-client = "^0.25.0"
click = "^8.5.0"
pretty-errors = "^1.2.25"
loguru = "^0.7.3"
Flask = "^3.1.3"
Flask-Caching = "^2.4.0"
Jinja2 = "^3.1.6"
waitress = "^3.0.2"
werkzeug = "^3.1.9"
arrow = "^1.4.0"
timy = "^0.4.2"
urllib3 = "^2.8.0"
requests-unixsocket = "^0.4.1"
systemd-python = "^235"

[tool.poetry.group.dev.dependencies]
pylint = "^4.1.3"
pytest = "^9.2.0"
black = "^26.10.1"
isort = "^9.0.2"
jedi = "^0.20.1"
pytest-cov = "^7.1.0"
requests = "^2.34.2"
pytest-mock = "^3.17.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.10.0"

[build-system]
requires = ["poetry-core>=2.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.coverage.run]
source = [
    "src"
]
omit = [
    ".venv/*",
    ".virtualenv/*",
    "tests/"
]

[tool.coverage.report]
fail_under = 70

[tool.coverage.html]
directory = ".html"

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: real Borg/borgmatic and exporter tests (select explicitly with -m integration)",
]

[tool.black]
skip_numeric_underscore_normalization = true
exclude = ".*(venv|virtualenv|migrations|node_modules|s3)"

[tool.isort]
profile = "black"
multi_line_output = 3
skip = '.virtualenv,.venv'
